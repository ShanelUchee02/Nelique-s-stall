<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nelique's — Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy:#1A1F6B; --navy-dark:#0F1245;
    --yellow:#FFD700; --yellow-dark:#E6C200; --yellow-light:#FFFBE6;
    --white:#FFFFFF; --bg:#F8F6EE;
    --text:#1A1F6B; --text-muted:#6B6FA8;
    --border:rgba(26,31,107,0.1);
    --green:#22C55E; --green-light:#F0FDF4;
    --amber:#F59E0B; --amber-light:#FFFBEB;
    --radius:16px; --shadow:0 2px 12px rgba(26,31,107,0.1);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* Header */
  header{background:var(--navy);border-bottom:3px solid var(--yellow);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .brand-wrap{display:flex;flex-direction:column;}
  .brand{font-family:'Fredoka One',cursive;font-size:20px;color:var(--yellow);}
  .brand-sub{font-family:'Pacifico',cursive;font-size:12px;color:rgba(255,255,255,.65);}
  .header-right{display:flex;align-items:center;gap:10px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
  .live-label{font-size:12px;font-weight:800;color:var(--yellow);}
  .tab-bar{display:flex;gap:4px;}
  .tab-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);transition:background .15s,color .15s;}
  .tab-btn.active{background:var(--yellow);color:var(--navy);}

  .pane{display:none;padding:1.25rem 1.5rem;}
  .pane.active{display:block;}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem;}
  .stat-card{background:var(--white);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);text-align:center;border-bottom:3px solid var(--yellow);}
  .stat-val{font-family:'Fredoka One',cursive;font-size:26px;}
  .stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;font-weight:700;}

  /* Filters */
  .filters{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .filter-btn{padding:5px 14px;border-radius:999px;font-size:12px;font-weight:800;border:2px solid var(--border);background:var(--white);cursor:pointer;color:var(--text-muted);transition:all .15s;}
  .filter-btn.active{background:var(--navy);color:var(--yellow);border-color:var(--navy);}

  /* Order cards */
  .orders-list{display:flex;flex-direction:column;gap:12px;}
  .order-card{background:var(--white);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);border-left:5px solid var(--yellow);animation:slideIn .3s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .order-card.status-ready     {border-left-color:var(--amber);}
  .order-card.status-paid      {border-left-color:var(--green);opacity:.65;}
  .order-card.status-cancelled {border-left-color:#ccc;opacity:.4;}

  .order-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
  .order-name{font-family:'Fredoka One',cursive;font-size:18px;color:var(--navy);}
  .order-time{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .order-num{font-size:11px;font-weight:800;background:var(--yellow-light);padding:2px 10px;border-radius:999px;color:var(--navy);}

  .status-pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .pill-pending  {background:var(--yellow-light);color:var(--navy);}
  .pill-ready    {background:var(--amber-light);color:#92400e;}
  .pill-paid     {background:var(--green-light);color:#166534;}
  .pill-cancelled{background:#f5f5f5;color:#999;}

  .order-items-list{font-size:13px;color:var(--text-muted);margin-bottom:10px;}
  .order-item-line{display:flex;align-items:center;gap:6px;padding:3px 0;font-weight:700;}
  .order-notes{font-size:12px;font-weight:700;background:var(--yellow-light);border-left:3px solid var(--yellow);border-radius:8px;padding:6px 10px;margin-bottom:10px;color:var(--navy);}
  .order-footer{display:flex;align-items:center;justify-content:space-between;}
  .order-total{font-family:'Fredoka One',cursive;font-size:20px;color:var(--navy);}
  .status-btns{display:flex;gap:6px;flex-wrap:wrap;}

  .s-btn{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;border:none;cursor:pointer;transition:opacity .15s,transform .1s;}
  .s-btn:active{transform:scale(.95);}
  .btn-ready {background:var(--amber-light);color:#92400e;}
  .btn-paid  {background:var(--navy);color:var(--yellow);}
  .btn-cancel{background:#f5f5f5;color:#999;}

  .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted);}
  .empty-emoji{font-size:48px;margin-bottom:8px;}

  /* Stock tab */
  .stock-section-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--navy);margin:1rem 0 .5rem;grid-column:1/-1;border-left:4px solid var(--yellow);padding-left:8px;}
  .stock-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stock-card{background:var(--white);border-radius:var(--radius);padding:.875rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;}
  .sc-top{display:flex;align-items:center;gap:8px;}
  .sc-emoji{font-size:22px;}
  .sc-name{font-size:13px;font-weight:800;flex:1;color:var(--navy);}
  .sc-badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;}
  .sc-ctrl{display:flex;align-items:center;gap:8px;}
  .sc-btn{width:28px;height:28px;border-radius:8px;border:2.5px solid var(--navy);background:var(--white);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .sc-input{width:56px;padding:4px 6px;border-radius:8px;border:2px solid var(--border);font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;text-align:center;outline:none;color:var(--navy);}
  .sc-input:focus{border-color:var(--yellow);}
  .save-stock-btn{background:var(--navy);color:var(--yellow);border:none;border-radius:999px;padding:10px 18px;font-family:'Fredoka One',cursive;font-size:16px;cursor:pointer;width:100%;margin-top:1.5rem;}
  .save-stock-btn:hover{background:var(--navy-dark);}
</style>
</head>
<body>

<header>
  <div class="brand-wrap">
    <div class="brand">Nelique's</div>
    <div class="brand-sub">Owner Dashboard</div>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="live-label">LIVE</span>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('orders',this)">Orders</button>
      <button class="tab-btn" onclick="switchTab('stock',this)">Stock</button>
    </div>
  </div>
</header>

<!-- Orders pane -->
<div class="pane active" id="pane-orders">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="stat-pending" style="color:var(--navy)">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-ready" style="color:var(--amber)">0</div>
      <div class="stat-label">Ready</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-paid" style="color:var(--green)">0</div>
      <div class="stat-label">Paid</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-revenue" style="color:var(--navy)">R0</div>
      <div class="stat-label">Collected</div>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">🆕 Pending</button>
    <button class="filter-btn" onclick="setFilter('ready',this)">⏳ Ready</button>
    <button class="filter-btn" onclick="setFilter('paid',this)">💵 Paid</button>
  </div>
  <div class="orders-list" id="orders-list">
    <div class="empty-state"><div class="empty-emoji">⏳</div>Waiting for orders...</div>
  </div>
</div>

<!-- Stock pane -->
<div class="pane" id="pane-stock">
  <div class="stock-grid" id="stock-grid">Loading...</div>
  <button class="save-stock-btn" onclick="saveStock()">Save stock levels</button>
</div>

<!-- ══════════════════════════════════════════
     FIREBASE CONFIG — same config as customer.html
     ══════════════════════════════════════════ -->
<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update }
                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ▼▼▼ PASTE YOUR FIREBASE CONFIG HERE ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyAYV2KcY5opolSrD-q02RIQNG1zLWrwboM",
  authDomain: "nelique-s.firebaseapp.com",
  databaseURL: "https://nelique-s-default-rtdb.firebaseio.com",
  projectId: "nelique-s",
  storageBucket: "nelique-s.firebasestorage.app",
  messagingSenderId: "339346873659",
  appId: "1:339346873659:web:53bbfac994f73035b4ab1e",
  measurementId: "G-HQM25RSFLB"
};
// ▲▲▲ PASTE YOUR FIREBASE CONFIG HERE ▲▲▲

// ── Menu items — keep in sync with customer.html ─────────
const MENU = [
  { id:1,  name:"Classic Bubble Waffle", emoji:"🧇", price:55, category:"Bubble Waffles" },
  { id:2,  name:"Berry Bubble Waffle",   emoji:"🍓", price:65, category:"Bubble Waffles" },
  { id:3,  name:"Choc Bubble Waffle",    emoji:"🍫", price:65, category:"Bubble Waffles" },
  { id:4,  name:"Loaded Bubble Waffle",  emoji:"🎉", price:85, category:"Bubble Waffles" },
  { id:5,  name:"Classic Bubble Boba",   emoji:"🧋", price:55, category:"Bubble Boba" },
  { id:6,  name:"Mango Boba",            emoji:"🥭", price:60, category:"Bubble Boba" },
  { id:7,  name:"Strawberry Boba",       emoji:"🍓", price:60, category:"Bubble Boba" },
  { id:8,  name:"Taro Boba",             emoji:"🫧", price:65, category:"Bubble Boba" },
  { id:9,  name:"Oreo Frappe",           emoji:"🍪", price:55, category:"Frappes & Ice Cream" },
  { id:10, name:"Caramel Frappe",        emoji:"🍮", price:55, category:"Frappes & Ice Cream" },
  { id:11, name:"Soft Serve Cone",       emoji:"🍦", price:30, category:"Frappes & Ice Cream" },
  { id:12, name:"Ice Cream Cup",         emoji:"🍨", price:40, category:"Frappes & Ice Cream" },
];

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let allOrders = {}, stockLevels = {}, activeFilter = "all";

// ── Listeners ─────────────────────────────────────────────
onValue(ref(db,"orders"), snap => { allOrders=snap.val()||{}; renderOrders(); updateStats(); });
onValue(ref(db,"stock"),  snap => { stockLevels=snap.val()||{}; renderStockGrid(); });

// ── Render orders ─────────────────────────────────────────
function renderOrders() {
  const list     = document.getElementById("orders-list");
  const keys     = Object.keys(allOrders).reverse();
  const filtered = keys.filter(k => activeFilter==="all" || allOrders[k].status===activeFilter);

  if (!filtered.length) {
    list.innerHTML=`<div class="empty-state"><div class="empty-emoji">🎉</div>${activeFilter==="all"?"No orders yet!":"Nothing here."}</div>`;
    return;
  }

  const pillLabel = {pending:"🆕 Pending", ready:"⏳ Ready", paid:"💵 Paid", cancelled:"✕ Cancelled"};
  const pillClass = {pending:"pill-pending", ready:"pill-ready", paid:"pill-paid", cancelled:"pill-cancelled"};

  list.innerHTML = filtered.map((key,idx) => {
    const o      = allOrders[key];
    const status = o.status||"pending";
    const num    = filtered.length-idx;
    const time   = o.timestamp ? new Date(o.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';

    const itemLines = (o.items||[]).map(i =>
      `<div class="order-item-line"><span>${i.emoji}</span><span>${i.name} ×${i.qty}</span><span style="margin-left:auto">R${(i.price*i.qty).toFixed(2)}</span></div>`
    ).join("");

    const notesHtml = o.notes ? `<div class="order-notes">📝 ${o.notes}</div>` : '';

    // Buttons per status
    let btns = '';
    if (status==='pending') {
      btns = `<button class="s-btn btn-ready"  onclick="setStatus('${key}','ready')">⏳ Mark Ready</button>
              <button class="s-btn btn-cancel"  onclick="setStatus('${key}','cancelled')">✕</button>`;
    } else if (status==='ready') {
      btns = `<button class="s-btn btn-paid"   onclick="markPaid('${key}')">💵 Paid</button>
              <button class="s-btn btn-cancel"  onclick="setStatus('${key}','cancelled')">✕</button>`;
    }

    return `<div class="order-card status-${status}" id="order-${key}">
      <div class="order-header">
        <div>
          <div class="order-name">${o.customer||'Customer'}</div>
          <div class="order-time">${time}</div>
        </div>
        <span class="order-num">#${num}</span>
      </div>
      <span class="status-pill ${pillClass[status]||'pill-pending'}">${pillLabel[status]||status}</span>
      <div class="order-items-list">${itemLines}</div>
      ${notesHtml}
      <div class="order-footer">
        <div class="order-total">R${(o.total||0).toFixed(2)}</div>
        <div class="status-btns">${btns}</div>
      </div>
    </div>`;
  }).join("");
}

// ── Stats ─────────────────────────────────────────────────
function updateStats() {
  const orders = Object.values(allOrders);
  document.getElementById("stat-pending").textContent = orders.filter(o=>o.status==='pending').length;
  document.getElementById("stat-ready").textContent   = orders.filter(o=>o.status==='ready').length;
  document.getElementById("stat-paid").textContent    = orders.filter(o=>o.status==='paid').length;
  const rev = orders.filter(o=>o.status==='paid').reduce((s,o)=>s+(o.total||0),0);
  document.getElementById("stat-revenue").textContent = "R"+rev.toFixed(0);
}

// ── Actions ───────────────────────────────────────────────
window.setStatus = (key,status) => update(ref(db,`orders/${key}`),{status});

// markPaid: sets status to paid AND deducts stock
window.markPaid = async key => {
  const order = allOrders[key];
  if (!order) return;
  const updates = { [`orders/${key}/status`]: "paid" };
  (order.items||[]).forEach(item => {
    const current = stockLevels[item.id]??0;
    updates[`stock/${item.id}`] = Math.max(0, current - item.qty);
  });
  await update(ref(db), updates);
};

// ── Filter ────────────────────────────────────────────────
window.setFilter = (f,btn) => {
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
};

// ── Tabs ──────────────────────────────────────────────────
window.switchTab = (tab,btn) => {
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  btn.classList.add('active');
};

// ── Stock grid ────────────────────────────────────────────
function renderStockGrid() {
  const cats = [...new Set(MENU.map(i=>i.category))];
  document.getElementById("stock-grid").innerHTML = cats.map(cat => {
    const items = MENU.filter(i=>i.category===cat);
    return `<div class="stock-section-title">${cat}</div>
      ${items.map(item => {
        const s = stockLevels[item.id]??20;
        const badgeStyle = s===0?'background:#FCEBEB;color:#A32D2D':s<=5?'background:#FAEEDA;color:#92400e':'background:#EAF3DE;color:#166534';
        return `<div class="stock-card">
          <div class="sc-top">
            <span class="sc-emoji">${item.emoji}</span>
            <span class="sc-name">${item.name}</span>
            <span class="sc-badge" style="${badgeStyle}">${s===0?'Out':s<=5?'Low':'OK'}</span>
          </div>
          <div class="sc-ctrl">
            <button class="sc-btn" onclick="adjustStock(${item.id},-1)">−</button>
            <input  class="sc-input" id="si-${item.id}" type="number" min="0" max="999" value="${s}"/>
            <button class="sc-btn" onclick="adjustStock(${item.id},1)">+</button>
          </div>
        </div>`;
      }).join("")}`;
  }).join("");
}

window.adjustStock = (id,delta) => {
  const input = document.getElementById("si-"+id);
  input.value = Math.max(0, parseInt(input.value||0)+delta);
};

window.saveStock = () => {
  const updates = {};
  MENU.forEach(item => {
    const input = document.getElementById("si-"+item.id);
    if (input) updates[`stock/${item.id}`] = Math.max(0, parseInt(input.value)||0);
  });
  update(ref(db),updates).then(()=>{
    const btn = document.querySelector('.save-stock-btn');
    btn.textContent="✓ Saved!"; btn.style.background="#22C55E";
    setTimeout(()=>{ btn.textContent="Save stock levels"; btn.style.background=""; },2000);
  });
};
</script>
</body>
</html>
