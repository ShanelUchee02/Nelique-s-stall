<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stall Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #F5F3EE;
    --card: #FFFFFF;
    --coral: #FF6B4A;
    --coral-light: #FFF0EC;
    --teal: #00B896;
    --teal-light: #E6FAF6;
    --amber: #F59E0B;
    --amber-light: #FFFBEB;
    --green: #22C55E;
    --green-light: #F0FDF4;
    --purple: #7C5CBF;
    --text: #1E1B14;
    --text-muted: #78716C;
    --border: rgba(0,0,0,0.07);
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--coral); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }
  .live-label { font-size: 12px; font-weight: 700; color: var(--green); }
  .tab-bar { display: flex; gap: 4px; }
  .tab-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer; background: transparent; color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: var(--coral); color: #fff; }

  /* ── Content ── */
  .pane { display: none; padding: 1.25rem 1.5rem; }
  .pane.active { display: block; }

  /* ── Stats row ── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.25rem; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); text-align: center; }
  .stat-val { font-family: 'Fredoka One', cursive; font-size: 28px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── Filters ── */
  .filters { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    border: 2px solid var(--border); background: #fff; cursor: pointer; color: var(--text-muted);
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  /* ── Order cards ── */
  .orders-list { display: flex; flex-direction: column; gap: 12px; }
  .order-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 1rem;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--coral);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .order-card.status-ready   { border-left-color: var(--amber); }
  .order-card.status-done    { border-left-color: var(--green); opacity: 0.7; }
  .order-card.status-cancelled { border-left-color: #ccc; opacity: 0.5; }
  .order-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .order-name { font-family: 'Fredoka One', cursive; font-size: 18px; }
  .order-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .order-num { font-size: 11px; font-weight: 700; background: var(--bg); padding: 2px 8px; border-radius: 999px; color: var(--text-muted); }
  .order-items-list { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .order-item-line { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .order-notes { font-size: 12px; background: var(--amber-light); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; color: #92400e; }
  .order-footer { display: flex; align-items: center; justify-content: space-between; }
  .order-total { font-family: 'Fredoka One', cursive; font-size: 18px; color: var(--coral); }
  .status-btns { display: flex; gap: 6px; }
  .s-btn {
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; border: none; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .s-btn:active { transform: scale(0.95); }
  .btn-ready  { background: var(--amber-light); color: #92400e; }
  .btn-done   { background: var(--green-light); color: #166534; }
  .btn-cancel { background: #f5f5f5; color: #999; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
  .empty-emoji { font-size: 48px; margin-bottom: 8px; }

  /* ── Stock tab ── */
  .stock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stock-section-title { font-family: 'Fredoka One', cursive; font-size: 18px; margin: 1rem 0 0.5rem; grid-column: 1/-1; }
  .stock-card {
    background: var(--card); border-radius: var(--radius); padding: 0.875rem;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px;
  }
  .sc-top { display: flex; align-items: center; gap: 8px; }
  .sc-emoji { font-size: 22px; }
  .sc-name { font-size: 13px; font-weight: 700; flex: 1; }
  .sc-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .sc-ctrl { display: flex; align-items: center; gap: 8px; }
  .sc-btn {
    width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--border);
    background: #fff; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .sc-num { font-size: 14px; font-weight: 700; min-width: 28px; text-align: center; }
  .sc-input {
    width: 56px; padding: 4px 6px; border-radius: 8px; border: 2px solid var(--border);
    font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; text-align: center; outline: none;
  }
  .sc-input:focus { border-color: var(--teal); }
  .save-stock-btn {
    background: var(--teal); color: #fff; border: none; border-radius: 999px;
    padding: 7px 18px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1.5rem;
  }
  .save-stock-btn:hover { background: #009478; }
</style>
</head>
<body>

<header>
  <div class="brand">🍦 Owner Dashboard</div>
  <div class="header-right">
    <div class="live-dot"></div>
    <span class="live-label">LIVE</span>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('orders', this)">Orders</button>
      <button class="tab-btn" onclick="switchTab('stock', this)">Stock</button>
    </div>
  </div>
</header>

<!-- ── Orders pane ── -->
<div class="pane active" id="pane-orders">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-val" id="stat-new" style="color:var(--coral)">0</div>
      <div class="stat-label">New</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-ready" style="color:var(--amber)">0</div>
      <div class="stat-label">Ready</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-revenue" style="color:var(--teal)">R0</div>
      <div class="stat-label">Collected</div>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('new', this)">🆕 New</button>
    <button class="filter-btn" onclick="setFilter('ready', this)">⏳ Ready</button>
    <button class="filter-btn" onclick="setFilter('done', this)">💵 Paid</button>
  </div>
  <div class="orders-list" id="orders-list">
    <div class="empty-state"><div class="empty-emoji">⏳</div>Waiting for orders...</div>
  </div>
</div>

<!-- ── Stock pane ── -->
<div class="pane" id="pane-stock">
  <div class="stock-grid" id="stock-grid">Loading...</div>
  <button class="save-stock-btn" onclick="saveStock()">Save stock levels</button>
</div>

<!-- ══════════════════════════════════════════════════════════
     FIREBASE CONFIG — paste your config object here
     (same config as customer.html)
     ══════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, update, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ▼▼▼ REPLACE THIS WITH YOUR FIREBASE CONFIG ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyAYV2KcY5opolSrD-q02RIQNG1zLWrwboM",
  authDomain: "nelique-s.firebaseapp.com",
  databaseURL: "https://nelique-s-default-rtdb.firebaseio.com",
  projectId: "nelique-s",
  storageBucket: "nelique-s.firebasestorage.app",
  messagingSenderId: "339346873659",
  appId: "1:339346873659:web:53bbfac994f73035b4ab1e",
  measurementId: "G-HQM25RSFLB"
};
// ▲▲▲ REPLACE THIS WITH YOUR FIREBASE CONFIG ▲▲▲

const MENU = [
  { id:1,  name:"Classic waffle",   emoji:"🧇", price:45, category:"Waffles" },
  { id:2,  name:"Berry waffle",     emoji:"🍓", price:55, category:"Waffles" },
  { id:3,  name:"Choc waffle",      emoji:"🍫", price:55, category:"Waffles" },
  { id:4,  name:"Vanilla scoop",    emoji:"🍦", price:30, category:"Ice cream" },
  { id:5,  name:"Choc scoop",       emoji:"🍫", price:30, category:"Ice cream" },
  { id:6,  name:"Strawberry scoop", emoji:"🍓", price:30, category:"Ice cream" },
  { id:7,  name:"Waffle cone",      emoji:"🍧", price:50, category:"Ice cream" },
  { id:8,  name:"Classic milk tea", emoji:"🧋", price:55, category:"Bubble tea" },
  { id:9,  name:"Taro bubble tea",  emoji:"🫧", price:60, category:"Bubble tea" },
  { id:10, name:"Matcha latte",     emoji:"🍵", price:60, category:"Bubble tea" },
  { id:11, name:"Brown sugar",      emoji:"🍮", price:65, category:"Bubble tea" },
];

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let allOrders   = {};
let stockLevels = {};
let activeFilter = "all";
let orderSeq = 0;

// ── Listen for orders ─────────────────────────────────────
onValue(ref(db, "orders"), snap => {
  allOrders = snap.val() || {};
  renderOrders();
  updateStats();
});

// ── Listen for stock ──────────────────────────────────────
onValue(ref(db, "stock"), snap => {
  stockLevels = snap.val() || {};
  renderStockGrid();
});

// ── Render orders ─────────────────────────────────────────
function renderOrders() {
  const list   = document.getElementById("orders-list");
  const keys   = Object.keys(allOrders).reverse();
  const filter = activeFilter;

  const filtered = keys.filter(k => filter === "all" || allOrders[k].status === filter);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-emoji">🎉</div>${filter === 'all' ? 'No orders yet!' : 'None here.'}</div>`;
    return;
  }

  orderSeq = 0;
  list.innerHTML = filtered.map((key, idx) => {
    const o = allOrders[key];
    const num = filtered.length - idx;
    const time = o.timestamp ? new Date(o.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    const statusClass = `status-${o.status || 'new'}`;
    const itemLines = (o.items || []).map(i =>
      `<div class="order-item-line"><span>${i.emoji}</span><span>${i.name} ×${i.qty}</span><span style="margin-left:auto;font-weight:700">R${(i.price*i.qty).toFixed(2)}</span></div>`
    ).join("");
    const notesHtml = o.notes ? `<div class="order-notes">📝 ${o.notes}</div>` : '';
    const actionBtns = (() => {
      if (o.status === 'new')   return `<button class="s-btn btn-ready" onclick="setStatus('${key}','ready')">⏳ Ready</button><button class="s-btn btn-done" onclick="setStatus('${key}','done')">💵 Paid</button><button class="s-btn btn-cancel" onclick="setStatus('${key}','cancelled')">✕</button>`;
      if (o.status === 'ready') return `<button class="s-btn btn-done" onclick="setStatus('${key}','done')">💵 Paid</button><button class="s-btn btn-cancel" onclick="setStatus('${key}','cancelled')">✕</button>`;
      return '';
    })();

    return `
      <div class="order-card ${statusClass}" id="order-${key}">
        <div class="order-header">
          <div>
            <div class="order-name">${o.customer || 'Customer'}</div>
            <div class="order-time">${time}</div>
          </div>
          <span class="order-num">#${num}</span>
        </div>
        <div class="order-items-list">${itemLines}</div>
        ${notesHtml}
        <div class="order-footer">
          <div class="order-total">R${(o.total || 0).toFixed(2)}</div>
          <div class="status-btns">${actionBtns}</div>
        </div>
      </div>`;
  }).join("");
}

// ── Update stats ──────────────────────────────────────────
function updateStats() {
  const orders = Object.values(allOrders);
  document.getElementById("stat-new").textContent   = orders.filter(o => o.status === 'new').length;
  document.getElementById("stat-ready").textContent = orders.filter(o => o.status === 'ready').length;
  const revenue = orders.filter(o => o.status === 'done').reduce((s,o) => s + (o.total||0), 0);
  document.getElementById("stat-revenue").textContent = "R" + revenue.toFixed(0);
}

// ── Set order status ──────────────────────────────────────
window.setStatus = function(key, status) {
  update(ref(db, `orders/${key}`), { status });
};

// ── Filter ────────────────────────────────────────────────
window.setFilter = function(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
};

// ── Tabs ──────────────────────────────────────────────────
window.switchTab = function(tab, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  btn.classList.add('active');
};

// ── Stock grid ────────────────────────────────────────────
function renderStockGrid() {
  const cats = [...new Set(MENU.map(i => i.category))];
  document.getElementById("stock-grid").innerHTML = cats.map(cat => {
    const items = MENU.filter(i => i.category === cat);
    return `
      <div class="stock-section-title">${cat}</div>
      ${items.map(item => {
        const stock = stockLevels[item.id] ?? 20;
        const cls   = stock === 0 ? 'background:#FCEBEB;color:#A32D2D' : stock <= 5 ? 'background:#FAEEDA;color:#92400e' : 'background:#EAF3DE;color:#166534';
        return `
          <div class="stock-card">
            <div class="sc-top">
              <span class="sc-emoji">${item.emoji}</span>
              <span class="sc-name">${item.name}</span>
              <span class="sc-badge" style="${cls}">${stock === 0 ? 'Out' : stock <= 5 ? 'Low' : 'OK'}</span>
            </div>
            <div class="sc-ctrl">
              <button class="sc-btn" onclick="adjustStock(${item.id},-1)">−</button>
              <input class="sc-input" id="si-${item.id}" type="number" min="0" max="999" value="${stock}" onchange="setStockInput(${item.id},this.value)"/>
              <button class="sc-btn" onclick="adjustStock(${item.id},1)">+</button>
            </div>
          </div>`;
      }).join("")}`;
  }).join("");
}

window.adjustStock = function(id, delta) {
  const input = document.getElementById("si-" + id);
  const newVal = Math.max(0, parseInt(input.value || 0) + delta);
  input.value = newVal;
};

window.setStockInput = function(id, val) {
  const v = parseInt(val);
  if (!isNaN(v) && v >= 0) document.getElementById("si-" + id).value = v;
};

window.saveStock = function() {
  const updates = {};
  MENU.forEach(item => {
    const input = document.getElementById("si-" + item.id);
    if (input) updates[`stock/${item.id}`] = Math.max(0, parseInt(input.value) || 0);
  });
  update(ref(db), updates).then(() => {
    const btn = document.querySelector('.save-stock-btn');
    btn.textContent = "✓ Saved!";
    btn.style.background = "#22C55E";
    setTimeout(() => { btn.textContent = "Save stock levels"; btn.style.background = ""; }, 2000);
  });
};
</script>
</body>
</html>
