<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Here 🧇</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cream: #FFF8F0;
    --peach: #FFE0C8;
    --coral: #FF6B4A;
    --coral-dark: #E5502F;
    --teal: #00B896;
    --teal-dark: #009478;
    --purple: #7C5CBF;
    --yellow: #FFD23F;
    --text: #2D2016;
    --text-muted: #8A7060;
    --card-bg: #FFFFFF;
    --border: rgba(0,0,0,0.07);
    --radius: 18px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 120px;
  }

  /* ── Header ── */
  header {
    background: var(--coral);
    padding: 1.25rem 1rem 1rem;
    text-align: center;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(255,107,74,0.3);
  }
  .store-name {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .store-tagline { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 2px; }

  /* ── Sections ── */
  .section { padding: 0 1rem; margin-top: 1.5rem; }
  .section-title {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 8px;
  }

  /* ── Item cards ── */
  .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .item-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 1rem;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
    user-select: none;
  }
  .item-card:active { transform: scale(0.96); }
  .item-card.in-cart { border-color: var(--teal); }
  .item-card.out { opacity: 0.45; pointer-events: none; }
  .item-emoji { font-size: 36px; display: block; margin-bottom: 6px; }
  .item-name { font-weight: 700; font-size: 14px; color: var(--text); }
  .item-price { font-size: 13px; color: var(--coral); font-weight: 700; margin-top: 2px; }
  .item-stock { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .item-qty-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--teal); color: #fff;
    font-size: 12px; font-weight: 700;
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.7);
    transition: opacity 0.2s, transform 0.2s;
  }
  .item-card.in-cart .item-qty-badge { opacity: 1; transform: scale(1); }

  /* ── Cart bar ── */
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 1rem;
    background: var(--cream);
    border-top: 1px solid var(--border);
    z-index: 20;
  }
  .cart-btn {
    width: 100%; padding: 1rem;
    background: var(--teal);
    color: #fff; border: none;
    border-radius: var(--radius);
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(0,184,150,0.35);
  }
  .cart-btn:hover { background: var(--teal-dark); }
  .cart-btn:active { transform: scale(0.98); }
  .cart-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
  .cart-count { background: rgba(255,255,255,0.25); border-radius: 999px; padding: 2px 10px; font-size: 16px; }
  .cart-total { font-size: 16px; }

  /* ── Cart sheet ── */
  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 30; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: all; }
  .sheet {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--cream); border-radius: 24px 24px 0 0;
    padding: 1.25rem 1rem 2rem;
    z-index: 40;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
    max-height: 90vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 1.25rem; }
  .sheet-title { font-family: 'Fredoka One', cursive; font-size: 22px; margin-bottom: 1rem; }
  .cart-item-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .cart-item-row:last-of-type { border-bottom: none; }
  .ci-emoji { font-size: 22px; }
  .ci-name { flex: 1; font-weight: 700; font-size: 14px; }
  .ci-price { font-size: 13px; color: var(--coral); font-weight: 700; }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qbtn {
    width: 28px; height: 28px; border-radius: 8px;
    border: 2px solid var(--border); background: #fff;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--text);
  }
  .qnum { font-size: 14px; font-weight: 700; min-width: 16px; text-align: center; }
  .name-section { margin: 1.25rem 0 0; }
  .name-label { font-weight: 700; font-size: 14px; margin-bottom: 6px; display: block; }
  .name-input {
    width: 100%; padding: 0.85rem 1rem;
    border: 2px solid var(--border); border-radius: var(--radius);
    font-family: 'Nunito', sans-serif; font-size: 15px;
    background: #fff; color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .name-input:focus { border-color: var(--teal); }
  .notes-input {
    width: 100%; padding: 0.85rem 1rem;
    border: 2px solid var(--border); border-radius: var(--radius);
    font-family: 'Nunito', sans-serif; font-size: 14px;
    background: #fff; color: var(--text);
    outline: none; resize: none; margin-top: 8px;
    transition: border-color 0.15s;
  }
  .notes-input:focus { border-color: var(--teal); }
  .order-total-row {
    display: flex; justify-content: space-between; align-items: center;
    margin: 1rem 0; padding: 1rem;
    background: var(--peach); border-radius: var(--radius);
  }
  .order-total-label { font-family: 'Fredoka One', cursive; font-size: 18px; }
  .order-total-amt { font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--coral); }
  .place-btn {
    width: 100%; padding: 1rem;
    background: var(--coral); color: #fff; border: none;
    border-radius: var(--radius);
    font-family: 'Fredoka One', cursive; font-size: 20px;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(255,107,74,0.35);
  }
  .place-btn:hover { background: var(--coral-dark); }
  .place-btn:active { transform: scale(0.98); }
  .place-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

  /* ── Success screen ── */
  .success {
    display: none; text-align: center;
    padding: 3rem 1.5rem;
    flex-direction: column; align-items: center; gap: 12px;
  }
  .success.show { display: flex; }
  .success-emoji { font-size: 72px; animation: bounce 0.5s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .success-title { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--teal); }
  .success-sub { font-size: 15px; color: var(--text-muted); }
  .new-order-btn {
    margin-top: 1rem; padding: 0.85rem 2rem;
    background: var(--coral); color: #fff; border: none; border-radius: var(--radius);
    font-family: 'Fredoka One', cursive; font-size: 18px; cursor: pointer;
  }
  .main-content.hidden { display: none; }

  /* ── Loading overlay ── */
  .loading { text-align: center; padding: 2rem; font-size: 14px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <div class="store-name">🛒 Pop-Up Stall</div>
  <div class="store-tagline">Waffles · Ice cream · Bubble tea</div>
</header>

<!-- Main menu -->
<div id="main-content" class="main-content">
  <div id="menu-container">
    <div class="loading">Loading menu...</div>
  </div>
</div>

<!-- Success screen -->
<div class="success" id="success-screen">
  <div class="success-emoji">🎉</div>
  <div class="success-title">Order placed!</div>
  <div class="success-sub" id="success-sub">We'll have it ready for you soon.</div>
  <button class="new-order-btn" onclick="resetOrder()">Order again</button>
</div>

<!-- Cart bar -->
<div class="cart-bar" id="cart-bar" style="display:none;">
  <button class="cart-btn" id="cart-btn" onclick="openSheet()">
    <span>View order <span class="cart-count" id="cart-count">0</span></span>
    <span class="cart-total" id="cart-total">R0.00</span>
  </button>
</div>

<!-- Sheet overlay -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Your order 🧾</div>
  <div id="sheet-items"></div>
  <div class="name-section">
    <label class="name-label" for="customer-name">Your name</label>
    <input class="name-input" id="customer-name" type="text" placeholder="e.g. Sarah" maxlength="40"/>
    <textarea class="notes-input" id="order-notes" rows="2" placeholder="Any notes? (e.g. no sugar, extra pearls)"></textarea>
  </div>
  <div class="order-total-row">
    <span class="order-total-label">Total</span>
    <span class="order-total-amt" id="sheet-total">R0.00</span>
  </div>
  <button class="place-btn" id="place-btn" onclick="placeOrder()">Place order 🎉</button>
</div>

<!-- ══════════════════════════════════════════════════════════
     FIREBASE CONFIG — paste your config object here
     Get it from: Firebase Console → Project Settings → Your apps → SDK setup
     ══════════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ▼▼▼ REPLACE THIS WITH YOUR FIREBASE CONFIG ▼▼▼
// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAYV2KcY5opolSrD-q02RIQNG1zLWrwboM",
  authDomain: "nelique-s.firebaseapp.com",
  databaseURL: "https://nelique-s-default-rtdb.firebaseio.com",
  projectId: "nelique-s",
  storageBucket: "nelique-s.firebasestorage.app",
  messagingSenderId: "339346873659",
  appId: "1:339346873659:web:53bbfac994f73035b4ab1e",
  measurementId: "G-HQM25RSFLB"
};
// ▲▲▲ REPLACE THIS WITH YOUR FIREBASE CONFIG ▲▲▲

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── Menu data (keep in sync with owner.html) ──────────────
const MENU = [
  { id:1,  name:"Classic waffle",   emoji:"🧇", price:45, category:"Waffles" },
  { id:2,  name:"Berry waffle",     emoji:"🍓", price:55, category:"Waffles" },
  { id:3,  name:"Choc waffle",      emoji:"🍫", price:55, category:"Waffles" },
  { id:4,  name:"Vanilla scoop",    emoji:"🍦", price:30, category:"Ice cream" },
  { id:5,  name:"Choc scoop",       emoji:"🍫", price:30, category:"Ice cream" },
  { id:6,  name:"Strawberry scoop", emoji:"🍓", price:30, category:"Ice cream" },
  { id:7,  name:"Waffle cone",      emoji:"🍧", price:50, category:"Ice cream" },
  { id:8,  name:"Classic milk tea", emoji:"🧋", price:55, category:"Bubble tea" },
  { id:9,  name:"Taro bubble tea",  emoji:"🫧", price:60, category:"Bubble tea" },
  { id:10, name:"Matcha latte",     emoji:"🍵", price:60, category:"Bubble tea" },
  { id:11, name:"Brown sugar",      emoji:"🍮", price:65, category:"Bubble tea" },
];

let cart = {};
let stockData = {};

// ── Listen for stock changes ───────────────────────────────
onValue(ref(db, "stock"), snap => {
  stockData = snap.val() || {};
  renderMenu();
});

// ── Render menu ───────────────────────────────────────────
function renderMenu() {
  const cats = [...new Set(MENU.map(i => i.category))];
  const container = document.getElementById("menu-container");
  container.innerHTML = cats.map(cat => {
    const items = MENU.filter(i => i.category === cat);
    const catEmoji = { Waffles:"🧇", "Ice cream":"🍦", "Bubble tea":"🧋" }[cat] || "";
    return `
      <div class="section">
        <div class="section-title">${catEmoji} ${cat}</div>
        <div class="item-grid">
          ${items.map(item => {
            const stock = stockData[item.id] ?? 99;
            const qty   = cart[item.id] || 0;
            return `
              <div class="item-card ${qty > 0 ? 'in-cart' : ''} ${stock === 0 ? 'out' : ''}"
                   id="card-${item.id}" onclick="toggleItem(${item.id})">
                <span class="item-emoji">${item.emoji}</span>
                <div class="item-name">${item.name}</div>
                <div class="item-price">R${item.price.toFixed(2)}</div>
                <div class="item-stock">${stock === 0 ? 'Sold out' : stock <= 5 ? `${stock} left` : 'Available'}</div>
                <div class="item-qty-badge" id="badge-${item.id}">${qty || ''}</div>
              </div>`;
          }).join("")}
        </div>
      </div>`;
  }).join("");
}

// ── Cart logic ────────────────────────────────────────────
window.toggleItem = function(id) {
  const stock = stockData[id] ?? 99;
  if (!cart[id]) {
    cart[id] = 1;
  } else if (cart[id] < stock) {
    cart[id]++;
  }
  updateCartUI();
};

window.changeSheetQty = function(id, delta) {
  const stock = stockData[id] ?? 99;
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  if (cart[id] > stock) cart[id] = stock;
  updateCartUI();
  renderSheet();
};

function cartTotal() {
  return Object.entries(cart).reduce((s,[id,q]) => s + MENU.find(i=>i.id==id).price * q, 0);
}
function cartCount() {
  return Object.values(cart).reduce((s,q) => s+q, 0);
}

function updateCartUI() {
  const count = cartCount();
  const total = cartTotal();
  const bar = document.getElementById("cart-bar");
  bar.style.display = count > 0 ? "block" : "none";
  document.getElementById("cart-count").textContent = count;
  document.getElementById("cart-total").textContent = "R" + total.toFixed(2);

  // update badges + card states
  MENU.forEach(item => {
    const badge = document.getElementById("badge-" + item.id);
    const card  = document.getElementById("card-" + item.id);
    if (!badge || !card) return;
    const qty = cart[item.id] || 0;
    badge.textContent = qty || '';
    card.classList.toggle("in-cart", qty > 0);
    badge.style.opacity = qty > 0 ? "1" : "0";
    badge.style.transform = qty > 0 ? "scale(1)" : "scale(0.7)";
  });
}

// ── Sheet ─────────────────────────────────────────────────
function renderSheet() {
  const keys = Object.keys(cart);
  document.getElementById("sheet-items").innerHTML = keys.map(id => {
    const item = MENU.find(i => i.id == id);
    const qty  = cart[id];
    return `
      <div class="cart-item-row">
        <span class="ci-emoji">${item.emoji}</span>
        <span class="ci-name">${item.name}</span>
        <div class="qty-ctrl">
          <button class="qbtn" onclick="changeSheetQty(${id},-1)">−</button>
          <span class="qnum">${qty}</span>
          <button class="qbtn" onclick="changeSheetQty(${id},1)">+</button>
        </div>
        <span class="ci-price">R${(item.price*qty).toFixed(2)}</span>
      </div>`;
  }).join("");
  document.getElementById("sheet-total").textContent = "R" + cartTotal().toFixed(2);
}

window.openSheet = function() {
  renderSheet();
  document.getElementById("sheet-overlay").classList.add("open");
  document.getElementById("sheet").classList.add("open");
};
window.closeSheet = function() {
  document.getElementById("sheet-overlay").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
};

// ── Place order ───────────────────────────────────────────
window.placeOrder = async function() {
  const name  = document.getElementById("customer-name").value.trim();
  const notes = document.getElementById("order-notes").value.trim();
  if (!name) { document.getElementById("customer-name").focus(); return; }

  const btn = document.getElementById("place-btn");
  btn.disabled = true;
  btn.textContent = "Sending...";

  const items = Object.entries(cart).map(([id,qty]) => {
    const item = MENU.find(i => i.id == id);
    return { id: Number(id), name: item.name, emoji: item.emoji, price: item.price, qty };
  });

  try {
    await push(ref(db, "orders"), {
      customer: name,
      notes: notes || null,
      items,
      total: cartTotal(),
      status: "new",
      timestamp: serverTimestamp()
    });

    closeSheet();
    document.getElementById("main-content").classList.add("hidden");
    document.getElementById("cart-bar").style.display = "none";
    const ss = document.getElementById("success-screen");
    ss.classList.add("show");
    document.getElementById("success-sub").textContent =
      `Thanks ${name}! Your order is on its way 🍃`;
    cart = {};
  } catch(e) {
    btn.disabled = false;
    btn.textContent = "Place order 🎉";
    alert("Could not send order. Check your internet and try again.");
  }
};

window.resetOrder = function() {
  cart = {};
  document.getElementById("success-screen").classList.remove("show");
  document.getElementById("main-content").classList.remove("hidden");
  document.getElementById("customer-name").value = "";
  document.getElementById("order-notes").value = "";
  updateCartUI();
};

</script>
</body>
</html>
