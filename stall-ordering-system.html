<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop-Up Stall — Ordering System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f4f0;
      --bg-tertiary: #eceae3;
      --text-primary: #1a1a18;
      --text-secondary: #6b6a65;
      --text-tertiary: #a09f9a;
      --border-light: rgba(0,0,0,0.1);
      --border-mid: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --accent: #1D9E75;
      --accent-dark: #0F6E56;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--bg-primary);
      border-bottom: 0.5px solid var(--border-light);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand { font-size: 20px; font-weight: 600; }
    .header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 1px; }
    .header-order { font-size: 12px; font-weight: 500; background: #FAEEDA; color: #633806; border-radius: 999px; padding: 4px 12px; }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 1fr 340px;
      min-height: calc(100vh - 64px);
    }

    /* ── Menu panel ── */
    .menu-panel {
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
    }
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }
    .category-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin: 1.25rem 0 0.5rem;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .item-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 0.875rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      user-select: none;
    }
    .item-card:hover { border-color: var(--border-mid); transform: translateY(-1px); }
    .item-card:active { transform: scale(0.97); }
    .item-card.out-of-stock { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .item-emoji { font-size: 28px; display: block; margin-bottom: 6px; }
    .item-name { font-size: 14px; font-weight: 500; }
    .item-price { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .stock-badge {
      position: absolute;
      top: 8px; right: 8px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .stock-ok  { background: #EAF3DE; color: #27500A; }
    .stock-low { background: #FAEEDA; color: #633806; }
    .stock-out { background: #FCEBEB; color: #791F1F; }

    /* ── Order panel ── */
    .order-panel {
      background: var(--bg-primary);
      border-left: 0.5px solid var(--border-light);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
    }
    .order-items { flex: 1; overflow-y: auto; min-height: 0; }
    .order-empty { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 2rem 0; }
    .order-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border-light);
    }
    .order-row:last-child { border-bottom: none; }
    .order-name { font-size: 13px; font-weight: 500; flex: 1; }
    .order-sub  { font-size: 12px; color: var(--text-secondary); }
    .qty-btn {
      width: 26px; height: 26px;
      border: 0.5px solid var(--border-mid);
      border-radius: 6px;
      background: var(--bg-secondary);
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--bg-tertiary); }
    .qty-num { font-size: 13px; font-weight: 500; min-width: 18px; text-align: center; }
    .order-item-price { font-size: 13px; font-weight: 500; min-width: 48px; text-align: right; }

    /* ── Footer ── */
    .order-footer {
      margin-top: 1rem;
      border-top: 0.5px solid var(--border-light);
      padding-top: 1rem;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }
    .total-label  { font-size: 13px; color: var(--text-secondary); }
    .total-amount { font-size: 24px; font-weight: 600; }
    .btn-pay {
      width: 100%; padding: 0.75rem;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-pay:hover { background: var(--accent-dark); }
    .btn-pay:disabled {
      background: var(--bg-tertiary);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }
    .btn-clear {
      width: 100%; padding: 0.5rem;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-mid);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-clear:hover { background: var(--bg-secondary); }

    /* ── Stock button ── */
    .btn-stock {
      font-size: 12px;
      border: 0.5px solid var(--border-mid);
      background: transparent;
      color: var(--text-secondary);
      padding: 5px 10px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .btn-stock:hover { background: var(--bg-secondary); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: #1a1a18;
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px; font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
    }
    .modal {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border-light);
      padding: 1.5rem;
      width: 320px;
    }
    .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 1rem; }
    .modal-items { font-size: 13px; color: var(--text-secondary); margin-bottom: 1rem; }
    .modal-items div { display: flex; justify-content: space-between; padding: 3px 0; }
    .modal-total {
      display: flex; justify-content: space-between;
      font-size: 15px; font-weight: 500;
      border-top: 0.5px solid var(--border-light);
      padding-top: 0.75rem;
      margin-bottom: 1rem;
    }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btns button {
      flex: 1; padding: 0.65rem;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-mid);
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .modal-confirm { background: var(--accent); color: #fff; border-color: var(--accent) !important; }
    .modal-confirm:hover { background: var(--accent-dark); }
    .modal-cancel  { background: transparent; color: var(--text-primary); }
    .modal-cancel:hover { background: var(--bg-secondary); }

    /* ── Stock modal ── */
    .stock-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0;
      border-bottom: 0.5px solid var(--border-light);
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-brand">🛒 Pop-Up Stall</div>
    <div class="header-sub" id="order-counter">Order #1</div>
  </div>
  <button class="btn-stock" onclick="toggleStock()">
    <i class="ti ti-package"></i> Manage stock
  </button>
</header>

<div class="app">
  <!-- ── Menu panel ── -->
  <div class="menu-panel">
    <div class="panel-title">Menu</div>
    <div id="menu-container"></div>
  </div>

  <!-- ── Order panel ── -->
  <div class="order-panel">
    <div class="panel-title">Current order</div>
    <div class="order-items" id="order-list">
      <div class="order-empty">Tap items to add them</div>
    </div>
    <div class="order-footer">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-amount" id="total">R0.00</span>
      </div>
      <button class="btn-pay" id="pay-btn" disabled onclick="openPayModal()">Confirm &amp; pay</button>
      <button class="btn-clear" onclick="clearOrder()">Clear order</button>
    </div>
  </div>
</div>

<!-- ── Pay modal ── -->
<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal">
    <h3>Confirm order</h3>
    <div class="modal-items" id="modal-items"></div>
    <div class="modal-total">
      <span>Total</span>
      <span id="modal-total"></span>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="completeOrder()">Paid ✓</button>
    </div>
  </div>
</div>

<!-- ── Stock modal ── -->
<div class="modal-overlay" id="stock-modal" style="display:none;">
  <div class="modal" style="width:360px;">
    <h3>Manage stock</h3>
    <div id="stock-list" style="margin-bottom:1rem;"></div>
    <div class="modal-btns">
      <button class="modal-cancel" style="flex:1;" onclick="closeStockModal()">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─────────────────────────────────────────────
  // MENU DATA — edit items, prices, and stock here
  // ─────────────────────────────────────────────
  const ITEMS = [
    { id: 1,  name: "Classic waffle",   emoji: "🧇", price: 45, category: "Waffles",    stock: 20 },
    { id: 2,  name: "Berry waffle",     emoji: "🍓", price: 55, category: "Waffles",    stock: 15 },
    { id: 3,  name: "Choc waffle",      emoji: "🍫", price: 55, category: "Waffles",    stock: 10 },
    { id: 4,  name: "Vanilla scoop",    emoji: "🍦", price: 30, category: "Ice cream",  stock: 25 },
    { id: 5,  name: "Choc scoop",       emoji: "🍫", price: 30, category: "Ice cream",  stock: 20 },
    { id: 6,  name: "Strawberry scoop", emoji: "🍓", price: 30, category: "Ice cream",  stock: 18 },
    { id: 7,  name: "Waffle cone",      emoji: "🍧", price: 50, category: "Ice cream",  stock: 12 },
    { id: 8,  name: "Classic milk tea", emoji: "🧋", price: 55, category: "Bubble tea", stock: 30 },
    { id: 9,  name: "Taro bubble tea",  emoji: "🫧", price: 60, category: "Bubble tea", stock: 20 },
    { id: 10, name: "Matcha latte",     emoji: "🍵", price: 60, category: "Bubble tea", stock: 15 },
    { id: 11, name: "Brown sugar",      emoji: "🍮", price: 65, category: "Bubble tea", stock: 12 },
  ];

  // ─────────────────────────────────────────────
  // App state
  // ─────────────────────────────────────────────
  let items = ITEMS.map(i => ({ ...i }));
  let order = {};
  let orderNum = 1;

  // ─────────────────────────────────────────────
  // Helpers
  // ─────────────────────────────────────────────
  function fmt(n) { return "R" + n.toFixed(2); }

  function stockClass(s) {
    if (s === 0) return "stock-out";
    if (s <= 5)  return "stock-low";
    return "stock-ok";
  }
  function stockLabel(s) {
    if (s === 0) return "Out";
    if (s <= 5)  return s + " left";
    return s;
  }

  // ─────────────────────────────────────────────
  // Render menu
  // ─────────────────────────────────────────────
  function renderMenu() {
    const cats = [...new Set(items.map(i => i.category))];
    document.getElementById("menu-container").innerHTML = cats.map(cat => {
      const catItems = items.filter(i => i.category === cat);
      return `
        <div class="category-label">${cat}</div>
        <div class="item-grid">
          ${catItems.map(item => `
            <div class="item-card ${item.stock === 0 ? 'out-of-stock' : ''}"
                 onclick="addItem(${item.id})"
                 role="button" tabindex="0"
                 aria-label="Add ${item.name}">
              <span class="item-emoji">${item.emoji}</span>
              <div class="item-name">${item.name}</div>
              <div class="item-price">${fmt(item.price)}</div>
              <span class="stock-badge ${stockClass(item.stock)}">${stockLabel(item.stock)}</span>
            </div>`).join("")}
        </div>`;
    }).join("");
  }

  // ─────────────────────────────────────────────
  // Render order
  // ─────────────────────────────────────────────
  function renderOrder() {
    const keys = Object.keys(order);
    const list = document.getElementById("order-list");

    if (!keys.length) {
      list.innerHTML = '<div class="order-empty">Tap items to add them</div>';
    } else {
      list.innerHTML = keys.map(id => {
        const item = items.find(i => i.id == id);
        const qty  = order[id];
        return `
          <div class="order-row">
            <div style="font-size:18px;flex-shrink:0;">${item.emoji}</div>
            <div style="flex:1;min-width:0;">
              <div class="order-name">${item.name}</div>
              <div class="order-sub">${fmt(item.price)} each</div>
            </div>
            <button class="qty-btn" onclick="changeQty(${id}, -1)" aria-label="Remove one">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="changeQty(${id}, 1)" aria-label="Add one">+</button>
            <div class="order-item-price">${fmt(item.price * qty)}</div>
          </div>`;
      }).join("");
    }

    const total = Object.entries(order).reduce((s, [id, q]) =>
      s + items.find(i => i.id == id).price * q, 0);
    document.getElementById("total").textContent = fmt(total);
    document.getElementById("pay-btn").disabled = !keys.length;
  }

  // ─────────────────────────────────────────────
  // Actions
  // ─────────────────────────────────────────────
  function addItem(id) {
    const item = items.find(i => i.id === id);
    if (!item || item.stock === 0) return;
    const currentQty = order[id] || 0;
    if (currentQty >= item.stock) { showToast("No more stock!"); return; }
    order[id] = currentQty + 1;
    renderOrder();
    showToast(item.name + " added");
  }

  function changeQty(id, delta) {
    const item = items.find(i => i.id == id);
    const nq = (order[id] || 0) + delta;
    if (nq <= 0) { delete order[id]; }
    else if (nq > item.stock) { showToast("Max stock reached"); return; }
    else { order[id] = nq; }
    renderOrder();
  }

  function clearOrder() { order = {}; renderOrder(); }

  // ─────────────────────────────────────────────
  // Pay modal
  // ─────────────────────────────────────────────
  function openPayModal() {
    const keys = Object.keys(order);
    document.getElementById("modal-items").innerHTML = keys.map(id => {
      const item = items.find(i => i.id == id);
      return `<div><span>${item.emoji} ${item.name} ×${order[id]}</span><span>${fmt(item.price * order[id])}</span></div>`;
    }).join("");
    const total = Object.entries(order).reduce((s, [id, q]) =>
      s + items.find(i => i.id == id).price * q, 0);
    document.getElementById("modal-total").textContent = fmt(total);
    document.getElementById("modal").style.display = "flex";
  }

  function closeModal() { document.getElementById("modal").style.display = "none"; }

  function completeOrder() {
    Object.entries(order).forEach(([id, qty]) => {
      const item = items.find(i => i.id == id);
      item.stock = Math.max(0, item.stock - qty);
    });
    order = {};
    orderNum++;
    document.getElementById("order-counter").textContent = "Order #" + orderNum;
    closeModal();
    renderMenu();
    renderOrder();
    showToast("Order complete! 🎉");
  }

  // ─────────────────────────────────────────────
  // Stock modal
  // ─────────────────────────────────────────────
  function toggleStock() {
    document.getElementById("stock-list").innerHTML = items.map(item => `
      <div class="stock-row">
        <span style="font-size:18px;">${item.emoji}</span>
        <span style="flex:1;font-size:13px;">${item.name}</span>
        <button class="qty-btn" onclick="adjustStock(${item.id}, -1)">−</button>
        <span class="qty-num" id="s-${item.id}">${item.stock}</span>
        <button class="qty-btn" onclick="adjustStock(${item.id}, 1)">+</button>
      </div>`).join("");
    document.getElementById("stock-modal").style.display = "flex";
  }

  function adjustStock(id, delta) {
    const item = items.find(i => i.id === id);
    item.stock = Math.max(0, item.stock + delta);
    document.getElementById("s-" + id).textContent = item.stock;
    renderMenu();
  }

  function closeStockModal() { document.getElementById("stock-modal").style.display = "none"; }

  // ─────────────────────────────────────────────
  // Toast
  // ─────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ─────────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────────
  renderMenu();
  renderOrder();
</script>
</body>
</html>
